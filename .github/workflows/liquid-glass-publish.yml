name: Publish the isolated Liquid Glass preview
on:
  push:
    tags: ['penlia-liquid-glass-preview-*']
permissions: {}
jobs:
  collect:
    if: github.repository == 'CharlonautArx/Penlia'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Collect and verify the reviewed package and native captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^penlia-liquid-glass-preview-([0-9]+)(-qa-([0-9]+))?(-r[0-9]+)?$ ]]
          build_run="${BASH_REMATCH[1]}"
          qa_run="${BASH_REMATCH[3]:-$build_run}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$qa_run" > "$RUNNER_TEMP/checked-qa"
          jq -e '.head_repository.full_name == "CharlonautArx/Penlia" and .path == ".github/workflows/liquid-glass-native.yml"' "$RUNNER_TEMP/checked-qa"
          qa_source=$(jq -er .head_sha "$RUNNER_TEMP/checked-qa")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" > "$RUNNER_TEMP/checked-run"
          jq -e '.head_repository.full_name == "CharlonautArx/Penlia" and .head_branch == "codex/liquid-glass-native" and .path == ".github/workflows/liquid-glass-native.yml"' "$RUNNER_TEMP/checked-run"
          source=$(jq -er .head_sha "$RUNNER_TEMP/checked-run")
          git diff --exit-code "$source" HEAD -- app.config.js src modules tooling package.json package-lock.json assets plugins
          gh run download "$build_run" -n "liquid-glass-arm64-v8a-$source" -D arm
          gh run download "$build_run" -n "liquid-glass-x86_64-$source" -D x86
          gh run download "$qa_run" -n "liquid-glass-android-35-$qa_source" -D api35
          gh run download "$qa_run" -n "liquid-glass-android-30-$qa_source" -D api30
          test "$(cat arm/source.txt)" = "$source"
          test "$(cat x86/source.txt)" = "$source"
          expected=$(cut -d' ' -f1 arm/sha256.txt)
          printf '%s  arm/Penlia-arm64-v8a.apk\n' "$expected" | sha256sum -c
          for device in api35 api30; do
            grep -Fq "$(cut -d' ' -f1 x86/sha256.txt)" "$device/checks.txt"
            grep -Fxq 'PASS side-by-side-installation' "$device/checks.txt"
            grep -Fxq 'PASS cold-start-inbox' "$device/checks.txt"
          done
          mkdir delivery
          cp arm/Penlia-arm64-v8a.apk delivery/Penlia-Liquid-Glass-arm64.apk
          cp arm/{badging.txt,source.txt} delivery/
          cp api35/00-inbox-comparison.png delivery/android-inbox-comparison.png
          cp api35/{01-inbox,02-friends,03-play,04-moments,05-me}.png delivery/
          cp api35/{optics-navigation,controls}.mp4 delivery/
          cp api35/checks.txt delivery/android-15.txt
          cp api30/checks.txt delivery/android-11.txt
          python3 - <<'PY'
          from zipfile import ZIP_DEFLATED, ZipFile
          from pathlib import Path
          with ZipFile('delivery/Penlia-native-screens.zip', 'w', ZIP_DEFLATED) as archive:
              for source in (Path('api35'), Path('api30')):
                  for image in sorted(source.glob('*.png')):
                      archive.write(image, image.as_posix())
          PY
          (cd delivery && sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt")
          cp "$RUNNER_TEMP/SHA256SUMS.txt" delivery/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-preview
          path: delivery/
          retention-days: 2
  release:
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: isolated-preview
          path: delivery/
      - name: Publish preview artifacts on the experiment tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd delivery && sha256sum -c SHA256SUMS.txt)
          printf '朋聊 Liquid Glass 独立离线体验版。安装包源码 %s。截图与录屏来自 Android 模拟器。\n' "$(cat delivery/source.txt)" > notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title '朋聊 · Liquid Glass Android 体验版' --notes-file notes.md delivery/*
