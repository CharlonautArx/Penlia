name: Android release startup diagnosis

on:
  workflow_dispatch:
    inputs:
      compare_baseline:
        description: Compare R8 on and off on the original preview source
        type: boolean
        default: false
  push:
    branches: [codex/penlia-android-startup-fix]

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Select the original source for the R8 comparison
        if: inputs.compare_baseline
        run: |
          cp scripts/android-startup-smoke.sh "$RUNNER_TEMP/penlia-startup-smoke.sh"
          rm scripts/android-startup-smoke.sh
          git fetch --depth 1 origin e99f649ec98a8c48475a88de7bff93de16f42a08
          git checkout --detach FETCH_HEAD
          mkdir -p scripts
          cp "$RUNNER_TEMP/penlia-startup-smoke.sh" scripts/android-startup-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install Android compilation tools
        run: |
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - name: Build x86_64 release APKs
        env:
          EAS_BUILD_PROFILE: ui-demo
          EXPO_PUBLIC_PENLIA_UI_DEMO: '1'
          CI: '1'
          VARIANTS: ${{ inputs.compare_baseline && 'a b' || 'fixed' }}
        run: |
          mkdir -p output
          npx expo prebuild --platform android --no-install
          for variant in $VARIANTS; do
            minify=true
            if [ "$variant" = b ]; then minify=false; fi
            (
              cd android
              ./gradlew :app:assembleRelease --max-workers=2 -PreactNativeArchitectures=x86_64 "-Pandroid.enableMinifyInReleaseBuilds=$minify"
            )
            cp android/app/build/outputs/apk/release/app-release.apk "output/$variant.apk"
          done
      - name: Set up KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture release startup logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: '16970787'
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash -c 'status=0; for apk in output/*.apk; do bash scripts/android-startup-smoke.sh "$apk" "${apk%.apk}" || status=1; done; exit "$status"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-logcat
          path: |
            output/a/
            output/b/
            output/fixed/
            output/*.apk
          retention-days: 7
          if-no-files-found: ignore
