name: Android release startup diagnosis

on:
  workflow_dispatch:
    inputs:
      compare_baseline:
        description: Compare R8 on and off on the original preview source
        type: boolean
        default: false
  push:
    branches: [codex/penlia-android-startup-fix]

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Save the smoke and security checks for the comparison
        if: inputs.compare_baseline
        run: |
          cp scripts/android-startup-smoke.sh "$RUNNER_TEMP/penlia-startup-smoke.sh"
          cp scripts/scan-release.py .gitleaks.toml "$RUNNER_TEMP/"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.compare_baseline
        with:
          ref: e99f649ec98a8c48475a88de7bff93de16f42a08
          persist-credentials: false
      - name: Restore the current checks on the comparison source
        if: inputs.compare_baseline
        run: |
          mkdir -p scripts
          cp "$RUNNER_TEMP/penlia-startup-smoke.sh" scripts/android-startup-smoke.sh
          cp "$RUNNER_TEMP/scan-release.py" scripts/
          cp "$RUNNER_TEMP/.gitleaks.toml" .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install Android compilation tools
        run: |
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - name: Build x86_64 release APKs
        env:
          EAS_BUILD_PROFILE: ui-demo
          EXPO_PUBLIC_PENLIA_UI_DEMO: '1'
          CI: '1'
          VARIANTS: ${{ inputs.compare_baseline && 'a b' || 'fixed' }}
        run: |
          mkdir -p output
          npx expo prebuild --platform android --no-install
          for variant in $VARIANTS; do
            minify=true
            if [ "$variant" = b ]; then minify=false; fi
            (
              cd android
              ./gradlew :app:assembleRelease --max-workers=2 -PreactNativeArchitectures=x86_64 "-Pandroid.enableMinifyInReleaseBuilds=$minify"
            )
            cp android/app/build/outputs/apk/release/app-release.apk "output/$variant.apk"
          done
      - name: Inspect the release APKs before installing or uploading
        id: scan-release
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (
            cd "$RUNNER_TEMP"
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
            tar -xzf gitleaks.tar.gz gitleaks
          )
          python3 scripts/scan-release.py --config .gitleaks.toml --scanner "$RUNNER_TEMP/gitleaks" output/*.apk
      - name: Set up KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Capture release startup logs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          emulator-build: '16970787'
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash -c 'status=0; for apk in output/*.apk; do bash scripts/android-startup-smoke.sh "$apk" "${apk%.apk}" || status=1; done; exit "$status"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scan-release.outcome == 'success'
        with:
          name: android-startup-offline-summary
          path: |
            output/*.apk
            output/*/checks.txt
            output/*/startup-errors.txt
            output/*/success.png
            output/*/failure.png
          retention-days: 7
          if-no-files-found: ignore
