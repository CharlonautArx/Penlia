name: Penlia tab headers Android release
on:
  push:
    tags: [penlia-tab-chrome-android-smoke]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [friends, play-profile]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Prepare hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          ls -l /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Verify tab layouts, safe area and relocated links
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: '16970787'
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -skin 720x1600 -memory 2048 -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/android-tab-chrome-smoke.sh demo-preview/tab-chrome-x86_64.apk output/ ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penlia-tab-chrome-runtime-${{ matrix.check }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
      - name: Diagnose emulator process exits
        if: failure()
        run: sudo dmesg | grep -Ei 'qemu|out of memory|killed process|segfault' | tail -20 || true
