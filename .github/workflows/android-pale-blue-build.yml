name: Penlia Pale Blue Dot Android Release
on:
  push:
    tags: [penlia-pale-blue-launch-build-v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 37
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install SDK, build tools and NDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - name: Compile x86_64 Release with R8
        run: |
          npx expo prebuild --platform android --no-install
          (
            cd android
            ./gradlew :app:assembleRelease --max-workers=3 -PreactNativeArchitectures=x86_64 -Pandroid.enableMinifyInReleaseBuilds=true
          )
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/penlia-pale-blue-x86_64.apk
      - name: Verify the packaged PNG matches the repository asset
        run: |
          cmp assets/startup/pale-blue-dot.png android/app/src/main/res/raw/penlia_launch_art.png
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          image = Path('assets/startup/pale-blue-dot.png').read_bytes()
          with ZipFile('out/penlia-pale-blue-x86_64.apk') as apk:
              matches = [name for name in apk.namelist() if name.startswith('res/') and apk.getinfo(name).file_size == len(image) and apk.read(name) == image]
              assert len(matches) == 1, matches
              print('Original PNG in APK:', matches[0], len(image), 'bytes')
          PYTHON
      - name: Validate Release signature, ABI and package
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/penlia-pale-blue-x86_64.apk | tee out/signer.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/penlia-pale-blue-x86_64.apk | tee out/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 out/penlia-pale-blue-x86_64.apk
          sha256sum out/penlia-pale-blue-x86_64.apk | tee out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: penlia-pale-blue-x86_64-release
          path: out/
          retention-days: 30
