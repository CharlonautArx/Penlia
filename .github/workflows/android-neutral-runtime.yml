name: Penlia neutral backgrounds Android visual regression
on:
  push:
    tags: [penlia-neutral-backgrounds-visual-v1]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [social, personal]
        revision: [before, after]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Prepare hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          ls -l /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Select comparison APK
        env:
          APK_REVISION: ${{ matrix.revision }}
        run: |
          if [[ "$APK_REVISION" = before ]]; then
            git fetch --depth 1 origin refs/tags/penlia-tab-chrome-android-smoke-v2
            git show FETCH_HEAD:demo-preview/tab-chrome-x86_64.apk > "$RUNNER_TEMP/penlia.apk"
          else
            cp demo-preview/neutral-x86_64.apk "$RUNNER_TEMP/penlia.apk"
          fi
      - name: Verify five tabs, core subpages and system theme
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: '16970787'
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -skin 720x1600 -memory 2048 -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/android-neutral-smoke.sh "$RUNNER_TEMP/penlia.apk" output/ ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penlia-neutral-${{ matrix.revision }}-${{ matrix.check }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
      - name: Diagnose emulator process exits
        if: failure()
        run: sudo dmesg | grep -Ei 'qemu|out of memory|killed process|segfault' | tail -20 || true
