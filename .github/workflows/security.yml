name: Security checks

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Obtain the pinned secret scanner
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 2 \
            -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Check tracked files and credentials
        run: |
          git ls-files -z | python3 -c '
          from pathlib import PurePosixPath
          import re,sys
          blocked = re.compile(r"(?:^|/)(?:credentials\.json$|\.env(?:\.|$))|\.(?:apk|aab|jks|keystore|key|pfx|p12|p8|mobileprovision)$", re.I)
          entries = sys.stdin.read().split("\0")
          if any(blocked.search(path) and PurePosixPath(path).name != ".env.example" for path in entries):
              sys.exit("A tracked file type is forbidden by the public repository policy.")
          '
          if ! "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact=100 --no-banner \
            --max-target-megabytes=2 --max-decode-depth=2 . > "$RUNNER_TEMP/secret-scan.log" 2>&1; then
            echo 'Secret scan did not pass. Review the redacted diagnostics locally.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --test --test-isolation=none tests/*.test.mjs server/security.test.mjs
