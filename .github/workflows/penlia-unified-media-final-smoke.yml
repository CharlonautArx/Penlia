name: Penlia 0.1.9 Android unified media and friend requests
on:
  push:
    tags: [penlia-unified-media-final-smoke]
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: "1"
      CI: "1"
    strategy:
      fail-fast: false
      matrix:
        api: [35]
        suite: [moments, peer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Start a virtual display for host-side recording
        run: |
          # Limit apt to Ubuntu's base packages, independent of third-party tool mirrors.
          opts=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            opts+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${opts[@]}" update -qq
          sudo apt-get "${opts[@]}" install -y --no-install-recommends junit4 python3-pil ffmpeg libpulse0 xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0
          Xvfb :93 -screen 0 880x1440x24 -ac +extension GLX > /tmp/space-xvfb.log 2>&1 &
          for attempt in $(seq 1 15); do
            if test -S /tmp/.X11-unix/X93; then break; fi
            sleep 1
          done
          if ! test -S /tmp/.X11-unix/X93; then cat /tmp/space-xvfb.log; exit 1; fi
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'QT_QPA_PLATFORM=xcb' >> "$GITHUB_ENV"
      - name: Wait for the matching x86 Release payload
        run: |
          for attempt in $(seq 1 105); do
            if gh api 'repos/${{ github.repository }}/actions/runs/45657985109/artifacts?name=penlia-unified-media-final-x86_64-release' --jq '.artifacts | length' | grep -Fxq 1; then
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for the specific Release artifact.' >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read the prior verified native build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: penlia-unified-media-final-x86_64-release
          path: out
          run-id: 45657985109
          github-token: ${{ github.token }}
      - name: Generate synthetic files at the exact size limits
        run: |
          mkdir -p fixture
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=15 -t 2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart fixture/base.mp4
          python3 - <<'PYMEDIA'
          from pathlib import Path
          from struct import pack
          original = Path('fixture/base.mp4').read_bytes()
          for size in (20, 21):
              remaining = size * 1024 * 1024 - len(original)
              Path(f'fixture/{size}mb.mp4').write_bytes(original + pack('>I4s', remaining, b'free') + bytes(remaining - 8))
          PYMEDIA
      - name: Exercise the offline interface
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          emulator-boot-timeout: 150
          emulator-build: '16970787'
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -gpu host -timezone Asia/Shanghai -no-skin -skin 540x1200 -memory 3072 -cores 4 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: bash scripts/penlia-unified-media-final-smoke.sh out/Penlia-x86_64.apk output/ ${{ matrix.suite }}
      - name: Emulator host diagnostics
        if: failure()
        run: |
          free -m
          cat /sys/fs/cgroup/memory.events || true
          sudo dmesg | grep -Ei 'out of memory|oom-kill|killed process|qemu.*segfault' | tail -10 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: penlia-unified-media-final-api-35-${{ matrix.suite }}
          path: |
            output/[0-9][0-9]-*.png
            output/checks.txt
            output/failure.png
          retention-days: 30
          if-no-files-found: ignore
