name: Penlia Android Play card blur diagnostic
on:
  push:
    tags: [penlia-play-card-blur-v1]
permissions:
  contents: read
  actions: read
jobs:
  native-blur:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: "1"
      CI: "1"
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - name: Read the prior verified native build
        uses: actions/download-artifact@v4
        with:
          name: penlia-brand-x86_64-release
          path: out
          run-id: 45060252986
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager --channel=3 'build-tools;37.0.0'
      - run: npm ci
      - run: python3 -m venv --system-site-packages "$RUNNER_TEMP/penlia-python"
      - run: |
          "$RUNNER_TEMP/penlia-python/bin/pip" install Pillow
          echo "$RUNNER_TEMP/penlia-python/bin" >> "$GITHUB_PATH"
      - name: Bundle the contrast fixture on the unchanged native runtime
        run: bash scripts/penlia-play-prepare-fixture.sh out/penlia-brand-x86_64.apk out/fixture.apk
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Measure the blur against an unblurred region
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: '16970787'
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -skin 720x1600 -memory 2048 -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/penlia-play-fixture-smoke.sh out/fixture.apk output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penlia-play-blur-api-${{ matrix.api }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
