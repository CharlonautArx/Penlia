name: Penlia interface release and verification
on:
  push:
    tags: [penlia-interface-release-v2]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install SDK, build tools and NDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci && npm run typecheck && node --test --test-isolation=none tests/*.test.mjs
      - name: Verify source commit
        run: |
          git rev-parse HEAD^
          git diff-tree --no-commit-id --name-only -r HEAD^
      - name: Compile Android Release with R8
        run: |
          npx expo prebuild --platform android --no-install
          (
            cd android
            ./gradlew :app:assembleRelease --max-workers=3 -PreactNativeArchitectures=${{ matrix.abi }} -Pandroid.enableMinifyInReleaseBuilds=true
          )
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/Penlia-${{ matrix.abi }}.apk
      - name: Verify the packaged PNG matches the repository asset
        run: |
          cmp assets/startup/pale-blue-dot.png android/app/src/main/res/raw/penlia_launch_art.png
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          image = Path('assets/startup/pale-blue-dot.png').read_bytes()
          with ZipFile('out/Penlia-${{ matrix.abi }}.apk') as apk:
              matches = [name for name in apk.namelist() if name.startswith('res/') and apk.getinfo(name).file_size == len(image) and apk.read(name) == image]
              assert len(matches) == 1, matches
              print('Original PNG in APK:', matches[0], len(image), 'bytes')
          PYTHON
      - name: Validate Release signature, ABI and package
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/Penlia-${{ matrix.abi }}.apk | tee out/signer.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/Penlia-${{ matrix.abi }}.apk | tee out/badging.txt
          grep -Fx "application-label:'朋聊'" out/badging.txt
          ! grep -F "朋聊演示" out/badging.txt
          grep -Fx "native-code: '${{ matrix.abi }}'" out/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 out/Penlia-${{ matrix.abi }}.apk
          sha256sum out/Penlia-${{ matrix.abi }}.apk | tee out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: penlia-interface-${{ matrix.abi }}-release
          path: out/
          retention-days: 30
  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: "1"
      CI: "1"
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - name: Read the Release built from this revision
        uses: actions/download-artifact@v4
        with:
          name: penlia-interface-x86_64-release
          path: out
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Start a virtual display for host-side recording
        run: |
          # Limit apt to Ubuntu's base packages, independent of third-party tool mirrors.
          opts=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            opts+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${opts[@]}" update -qq
          sudo apt-get "${opts[@]}" install -y --no-install-recommends python3-pil libpulse0 xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0
          Xvfb :93 -screen 0 880x1440x24 -ac +extension GLX > /tmp/space-xvfb.log 2>&1 &
          sleep 1
          test -S /tmp/.X11-unix/X93
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'QT_QPA_PLATFORM=xcb' >> "$GITHUB_ENV"
      - name: Exercise the offline interface
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 150
          emulator-build: '16970787'
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -gpu host -no-skin -skin 540x1200 -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/penlia-interface-check.sh out/Penlia-x86_64.apk output/
      - name: Emulator host diagnostics
        if: failure()
        run: |
          free -m
          cat /sys/fs/cgroup/memory.events || true
          sudo dmesg | grep -Ei 'out of memory|oom-kill|killed process|qemu.*segfault' | tail -10 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penlia-interface-after-api-${{ matrix.api }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
