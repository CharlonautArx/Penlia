name: Penlia Android emulator preflight
on:
  push:
    tags: [penlia-startup-emulator-preflight]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Prepare hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Verify Android 35 emulator can boot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: '16970787'
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: adb shell getprop sys.boot_completed
