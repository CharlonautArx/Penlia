name: Liquid Glass native Release and device review
on:
  push:
    branches: [codex/liquid-glass-native]
    tags: [penlia-liquid-glass-device-*]
    paths: ['src/**', 'modules/**', 'app.config.js', 'tooling/**', '.github/workflows/liquid-glass-native.yml', 'scripts/liquid-glass-check.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref_type != 'tag' && !contains(github.event.head_commit.message, '[glass-harness]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ contains(github.event.head_commit.message, '[glass-review]') && fromJSON('["x86_64"]') || fromJSON('["x86_64","arm64-v8a"]') }}
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: '1'
      EXPO_PUBLIC_PENLIA_LIQUID_GLASS: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install SDK, build tools and NDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci && npm ci --prefix server --ignore-scripts && npm run typecheck && node --test --test-isolation=none tests/*.test.mjs
      - name: Use the CI-provisioned Java toolchain for ARM64
        if: matrix.abi == 'arm64-v8a'
        run: |
          # React Native needs Java 17, which setup-java already installed.
          # Avoid resolving the optional download plugin from the Gradle Plugin Portal.
          java -version 2>&1 | grep -E '^openjdk version "17[.]'
          settings=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          resolver='plugins { id("org.gradle.toolchains.foojay-resolver-convention").version("1.0.0") }'
          test "$(grep -Fxc "$resolver" "$settings")" = 1
          sed -i '/^plugins { id("org[.]gradle[.]toolchains[.]foojay-resolver-convention")[.]version("1[.]0[.]0") }$/d' "$settings"
          ! grep -F 'foojay-resolver-convention' "$settings"
      - name: Compile Android Release with R8
        run: |
          test ! -L node_modules/react-native-worklets/android/build
          npx expo prebuild --platform android --no-install
          (
            cd android
            ./gradlew :app:assembleRelease --max-workers=3 -PreactNativeArchitectures=${{ matrix.abi }} -Pandroid.enableMinifyInReleaseBuilds=true
          )
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/Penlia-${{ matrix.abi }}.apk
      - name: Verify the packaged PNG matches the repository asset
        run: |
          cmp assets/startup/pale-blue-dot.png android/app/src/main/res/raw/penlia_launch_art.png
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          image = Path('assets/startup/pale-blue-dot.png').read_bytes()
          with ZipFile('out/Penlia-${{ matrix.abi }}.apk') as apk:
              matches = [name for name in apk.namelist() if name.startswith('res/') and apk.getinfo(name).file_size == len(image) and apk.read(name) == image]
              assert len(matches) == 1, matches
              print('Original PNG in APK:', matches[0], len(image), 'bytes')
          PYTHON
      - name: Validate Release signature, ABI and package
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/Penlia-${{ matrix.abi }}.apk > /dev/null
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/Penlia-${{ matrix.abi }}.apk | tee out/badging.txt
          grep -Fx "application-label:'朋聊 · Liquid Glass 体验版'" out/badging.txt
          grep -F "package: name='app.penlia.mobile.liquidglass'" out/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump xmltree out/Penlia-${{ matrix.abi }}.apk AndroidManifest.xml |
            grep -F 'android:allowBackup(0x01010280)=(type 0x12)0x0' > out/data-isolation.txt
          echo "$GITHUB_SHA" > out/source.txt
          ! grep -F "朋聊演示" out/badging.txt
          grep -Fx "native-code: '${{ matrix.abi }}'" out/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 out/Penlia-${{ matrix.abi }}.apk
          sha256sum out/Penlia-${{ matrix.abi }}.apk | tee out/sha256.txt
      - name: Scan Release packages before publishing
        run: |
          curl -fSsL --retry 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (
            cd "$RUNNER_TEMP"
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
            tar -xzf gitleaks.tar.gz gitleaks
          )
          python3 scripts/scan-release.py --config .gitleaks.toml --scanner "$RUNNER_TEMP/gitleaks" out/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquid-glass-${{ matrix.abi }}-${{ github.sha }}
          path: out/
          retention-days: 30
  device:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api: ${{ contains(github.event.head_commit.message, '[glass-review]') && fromJSON('[35]') || fromJSON('[35,30]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select the tested application build
        id: binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "$GITHUB_REF_TYPE" = tag; then
            [[ "$GITHUB_REF_NAME" =~ ^penlia-liquid-glass-device-([0-9]+)(-r[0-9]+)?$ ]]
            build_run="${BASH_REMATCH[1]}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" > "$RUNNER_TEMP/build-run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" '.head_repository.full_name == $repo and .head_branch == "codex/liquid-glass-native" and .path == ".github/workflows/liquid-glass-native.yml"' "$RUNNER_TEMP/build-run.json"
            client=$(jq -er .head_sha "$RUNNER_TEMP/build-run.json")
          else
            build_run="$GITHUB_RUN_ID"
            client="$GITHUB_SHA"
          fi
          echo "run=$build_run" >> "$GITHUB_OUTPUT"
          echo "source=$client" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: liquid-glass-x86_64-${{ steps.binary.outputs.source }}
          path: out/
          run-id: ${{ steps.binary.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify the client matches the build
        run: |
          test "$(cat out/source.txt)" = "${{ steps.binary.outputs.source }}"
          sha256sum -c out/sha256.txt
      - name: Retrieve the unmodified original simulator package
        if: ${{ !contains(github.event.head_commit.message, '[glass-review]') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45998981394
          name: together-x86_64-f78d89295d78762259b2862ee5bdc799a14d1ab6
          path: original/
      - name: Verify the original artifact checksum
        if: ${{ !contains(github.event.head_commit.message, '[glass-review]') }}
        run: sed 's#  out/#  original/#' original/sha256.txt | sha256sum -c
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Start a virtual display for host-side recording
        run: |
          # Limit apt to Ubuntu's base packages, independent of third-party tool mirrors.
          opts=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            opts+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${opts[@]}" update -qq
          sudo apt-get "${opts[@]}" install -y --no-install-recommends junit4 python3-pil ffmpeg libpulse0 xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0
          Xvfb :93 -screen 0 880x1440x24 -ac +extension GLX > /tmp/space-xvfb.log 2>&1 &
          for attempt in $(seq 1 15); do
            if test -S /tmp/.X11-unix/X93; then break; fi
            sleep 1
          done
          if ! test -S /tmp/.X11-unix/X93; then cat /tmp/space-xvfb.log; exit 1; fi
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'QT_QPA_PLATFORM=xcb' >> "$GITHUB_ENV"
      - name: Review the real Android client
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          emulator-boot-timeout: 150
          emulator-build: '16970787'
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -gpu host -timezone Asia/Shanghai -no-skin -skin 540x1200 -memory 3072 -cores 4 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: /usr/bin/python3 scripts/liquid-glass-check.py out/Penlia-x86_64.apk evidence ${{ contains(github.event.head_commit.message, '[glass-review]') && '--core' || '--full' }}
      - name: Scan the evidence allowlist
        id: scan_evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          files = [p for p in Path('evidence').glob('*') if p.suffix in {'.png','.mp4'} or p.name == 'checks.txt']
          assert files, 'No emulator evidence'
          with ZipFile('emulator.zip','w') as z:
              for p in files: z.write(p,p.name)
          PYTHON
          curl -fSsL --retry 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (
            cd "$RUNNER_TEMP"
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
            tar -xzf gitleaks.tar.gz gitleaks
          )
          python3 scripts/scan-release.py --config .gitleaks.toml --scanner "$RUNNER_TEMP/gitleaks" emulator.zip
      - name: Upload emulator evidence
        if: always() && steps.scan_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquid-glass-android-${{ matrix.api }}-${{ github.sha }}
          path: |
            evidence/*.png
            evidence/*.mp4
            evidence/checks.txt
          if-no-files-found: ignore
          retention-days: 30
