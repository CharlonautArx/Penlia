name: Publish verified Penlia ARM64 APK download
on:
  push:
    tags: [penlia-chat-background-publish-v2]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e867f2e7ebdc14730ce63d2d48bf30f9873d427
      - uses: actions/download-artifact@v4
        with:
          name: penlia-chat-background-arm64-release
          path: out
          run-id: 45194511215
          github-token: ${{ github.token }}
      - name: Verify the previously tested APK and publish the raw file
        run: |
          printf '%s  %s\n' 5dafafc553b6f2fca934aaa6944ea53644bf57efe128af4eb6ea456df3368be2 out/Penlia-arm64.apk | sha256sum -c -
          install -m 0644 out/Penlia-arm64.apk demo-preview/Penlia-arm64.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- demo-preview/Penlia-arm64.apk
          git commit -m 'Publish Penlia Chat Background ARM64 APK [skip ci]'
          git push origin HEAD:refs/tags/penlia-chat-background-arm64-v2-apk
