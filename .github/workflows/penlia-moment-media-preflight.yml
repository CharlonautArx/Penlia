name: Penlia 0.1.6 Android moment editor interactions
on:
  push:
    tags: [penlia-moment-media-native-preflight]
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: "1"
      CI: "1"
    strategy:
      fail-fast: false
      matrix:
        api: [35]
        suite: [feed, photos, edge, video]
    steps:
      - uses: actions/checkout@v4
      - name: Read the prior verified native build
        uses: actions/download-artifact@v4
        with:
          name: penlia-moment-media-x86_64-release
          path: out
          run-id: 45557302463
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Prepare temporary native diagnostic package
        run: |
          sdkmanager --channel=3 'build-tools;37.0.0'
          sdk="$ANDROID_HOME/build-tools/37.0.0"
          python3 scripts/rebundle-moment-preflight.py out/Penlia-x86_64.apk out/preflight-unsigned.apk scripts/native-fix.hbc
          "$sdk/zipalign" -P 16 -f 4 out/preflight-unsigned.apk out/preflight-aligned.apk
          keytool -genkeypair -noprompt -keystore out/preflight.jks -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Penlia Emulator Test,O=Penlia,C=US' -keyalg RSA -keysize 2048 -validity 1
          "$sdk/apksigner" sign --ks out/preflight.jks --ks-pass pass:android --key-pass pass:android --out out/preflight.apk out/preflight-aligned.apk
          "$sdk/apksigner" verify out/preflight.apk
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Start a virtual display for host-side recording
        run: |
          # Limit apt to Ubuntu's base packages, independent of third-party tool mirrors.
          opts=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            opts+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${opts[@]}" update -qq
          sudo apt-get "${opts[@]}" install -y --no-install-recommends junit4 python3-pil libpulse0 xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0
          Xvfb :93 -screen 0 880x1440x24 -ac +extension GLX > /tmp/space-xvfb.log 2>&1 &
          for attempt in $(seq 1 15); do
            if test -S /tmp/.X11-unix/X93; then break; fi
            sleep 1
          done
          if ! test -S /tmp/.X11-unix/X93; then cat /tmp/space-xvfb.log; exit 1; fi
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'QT_QPA_PLATFORM=xcb' >> "$GITHUB_ENV"
      - name: Exercise the offline interface
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 150
          emulator-build: '16970787'
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -gpu host -no-skin -skin 540x1200 -memory 3072 -cores 4 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: bash scripts/penlia-moment-media-smoke.sh out/preflight.apk output/ ${{ matrix.suite }}
      - name: Emulator host diagnostics
        if: failure()
        run: |
          free -m
          cat /sys/fs/cgroup/memory.events || true
          sudo dmesg | grep -Ei 'out of memory|oom-kill|killed process|qemu.*segfault' | tail -10 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penlia-moment-media-preflight-api-35-${{ matrix.suite }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
