name: Penlia Android branding release
on:
  push:
    branches: [codex/penlia-new-branding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    env:
      EAS_BUILD_PROFILE: ui-demo
      EXPO_PUBLIC_PENLIA_UI_DEMO: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install SDK, build tools and NDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - run: npm run typecheck
        if: matrix.abi == 'x86_64'
      - name: Use the CI-provisioned Java toolchain for ARM64
        if: matrix.abi == 'arm64-v8a'
        run: |
          # React Native needs Java 17, which setup-java already installed.
          # Avoid resolving the optional download plugin from the Gradle Plugin Portal.
          java -version 2>&1 | grep -E '^openjdk version "17[.]'
          settings=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          resolver='plugins { id("org.gradle.toolchains.foojay-resolver-convention").version("1.0.0") }'
          test "$(grep -Fxc "$resolver" "$settings")" = 1
          sed -i '/^plugins { id("org[.]gradle[.]toolchains[.]foojay-resolver-convention")[.]version("1[.]0[.]0") }$/d' "$settings"
          ! grep -F 'foojay-resolver-convention' "$settings"
      - name: Compile Android Release with R8
        run: |
          test ! -L node_modules/react-native-worklets/android/build
          npx expo prebuild --platform android --no-install
          (
            cd android
            ./gradlew :app:assembleRelease --max-workers=3 -PreactNativeArchitectures=${{ matrix.abi }} -Pandroid.enableMinifyInReleaseBuilds=true
          )
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/Penlia-${{ matrix.abi }}.apk
      - name: Verify the packaged branding and scope
        run: |
          cmp assets/startup/penlia_new_splash.jpg android/app/src/main/res/raw/penlia_launch_art.jpg
          test ! -e android/app/src/main/res/raw/penlia_launch_art.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.webp
          git diff --exit-code 002ea5514cdc56f87865bd2d4d38e3af447836fd HEAD -- src app server modules app.config.js plugins/penlia-launch
          sha256sum assets/branding/penlia_new_icon.jpg assets/startup/penlia_new_splash.jpg
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          image = Path('assets/startup/penlia_new_splash.jpg').read_bytes()
          obsolete = Path('assets/startup/pale-blue-dot.png').read_bytes()
          with ZipFile('out/Penlia-${{ matrix.abi }}.apk') as apk:
              matches = [name for name in apk.namelist() if name.startswith('res/') and apk.getinfo(name).file_size == len(image) and apk.read(name) == image]
              assert len(matches) == 1, matches
              assert not any(apk.read(entry) == obsolete for entry in apk.infolist() if entry.file_size == len(obsolete))
              print('Original JPEG in APK:', matches[0], len(image), 'bytes')
          PYTHON
      - name: Validate Release signature, ABI and package
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/Penlia-${{ matrix.abi }}.apk > /dev/null
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/Penlia-${{ matrix.abi }}.apk | tee out/badging.txt
          grep -Fx "application-label:'朋聊'" out/badging.txt
          grep -F "package: name='app.penlia.mobile.preview'" out/badging.txt
          echo "$GITHUB_SHA" > out/source.txt
          grep -Fx "native-code: '${{ matrix.abi }}'" out/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 out/Penlia-${{ matrix.abi }}.apk
          sha256sum out/Penlia-${{ matrix.abi }}.apk | tee out/sha256.txt
      - name: Scan Release packages before publishing
        run: |
          curl -fSsL --retry 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (
            cd "$RUNNER_TEMP"
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
            tar -xzf gitleaks.tar.gz gitleaks
          )
          python3 scripts/scan-release.py --config .gitleaks.toml --scanner "$RUNNER_TEMP/gitleaks" out/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branding-${{ matrix.abi }}-${{ github.sha }}
          path: out/
          retention-days: 30
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branding-x86_64-${{ github.sha }}
          path: package
      - name: Prepare emulator acceleration and capture tools
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          command -v ffmpeg
          if ! python3 -c 'import PIL'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-pil
          fi
      - name: Install and capture an offline Android cold start
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          emulator-build: '16970787'
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -cores 4 -no-skin -skin 540x1200 -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/android-branding-check.py package/Penlia-x86_64.apk evidence
      - name: Scan the isolated emulator captures
        id: scan
        if: always() && steps.emulator.outcome != 'skipped'
        run: |
          curl -fSsL --retry 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (
            cd "$RUNNER_TEMP"
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
            tar -xzf gitleaks.tar.gz gitleaks
          )
          zip -j "$RUNNER_TEMP/branding-evidence.zip" evidence/*.png evidence/*.txt evidence/*.mp4
          python3 scripts/scan-release.py --config .gitleaks.toml --scanner "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/branding-evidence.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: branding-android-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 30

  release:
    needs: [build, device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branding-arm64-v8a-${{ github.sha }}
          path: arm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branding-android-evidence-${{ github.sha }}
          path: delivery
      - name: Publish the installable and verified preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat arm/source.txt)" = "$GITHUB_SHA"
          expected=$(cut -d' ' -f1 arm/sha256.txt)
          printf '%s  arm/Penlia-arm64-v8a.apk\n' "$expected" | sha256sum -c
          mv arm/Penlia-arm64-v8a.apk delivery/Penlia-New-Branding-arm64.apk
          (cd delivery && sha256sum Penlia-New-Branding-arm64.apk > SHA256SUMS.txt)
          printf '朋聊的新桌面图标及原生启动画面。ARM64 离线预览 APK 及 Android 15 模拟器验收材料。源码 %s。\n' "$GITHUB_SHA" > notes.md
          gh release create "penlia-new-branding-${GITHUB_SHA:0:12}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false --title '朋聊 · 新图标与启动画面' --notes-file notes.md delivery/*
